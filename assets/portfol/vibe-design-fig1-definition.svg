<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Five design thinking stages. Empathize, Define and Ideate are led by the designer. Prototype and Test are supported by AI. An arrow loops from Test back to Empathize." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
          <defs>
            <marker id="vdA1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#86837b"/></marker>
          </defs>
          <!-- loop -->
          <path d="M640 70 V30 H80 V66" fill="none" stroke="#86837b" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#vdA1)"/>
          <text x="360" y="22" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#86837b">iterate</text>
          <!-- human-led -->
          <g font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle">
            <rect x="20"  y="70" width="120" height="64" rx="12" fill="#ecebe6"/>
            <text x="80"  y="107" fill="#1c1c1a">Empathize</text>
            <rect x="160" y="70" width="120" height="64" rx="12" fill="#ecebe6"/>
            <text x="220" y="107" fill="#1c1c1a">Define</text>
            <rect x="300" y="70" width="120" height="64" rx="12" fill="#ecebe6"/>
            <text x="360" y="107" fill="#1c1c1a">Ideate</text>
            <!-- AI-supported -->
            <rect x="440" y="70" width="120" height="64" rx="12" fill="#e7eefb" stroke="#2f6fd6"/>
            <text x="500" y="102" fill="#1c1c1a">Prototype</text>
            <text x="500" y="121" fill="#2f6fd6" font-size="12" font-family="IBM Plex Mono, monospace">+ AI</text>
            <rect x="580" y="70" width="120" height="64" rx="12" fill="#e7eefb" stroke="#2f6fd6"/>
            <text x="640" y="102" fill="#1c1c1a">Test</text>
            <text x="640" y="121" fill="#2f6fd6" font-size="12" font-family="IBM Plex Mono, monospace">+ AI</text>
          </g>
          <!-- brackets -->
          <path d="M20 156 V164 H420 V156" fill="none" stroke="#1c1c1a" stroke-width="1"/>
          <path d="M440 156 V164 H700 V156" fill="none" stroke="#2f6fd6" stroke-width="1"/>
          <g font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">
            <text x="220" y="190" fill="#1c1c1a">Designer leads</text>
            <text x="220" y="210" fill="#86837b" font-size="13">understanding people, framing the problem</text>
            <text x="570" y="190" fill="#2f6fd6">AI supports, designer reviews</text>
            <text x="570" y="210" fill="#86837b" font-size="13">making screens, gathering feedback</text>
          </g>
        </svg>