            <circle cx="253" cy="207" r="4"/><circle cx="320" cy="207" r="4"/><circle cx="387" cy="207" r="4"/><circle cx="454" cy="207" r="4"/><circle cx="521" cy="207" r="4"/><circle cx="588" cy="207" r="4"/><circle cx="655" cy="207" r="4"/>
