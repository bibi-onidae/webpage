<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="SGI matrix. Rows are screens with their scenarios; columns are seven usability goals. For the login screen, the counts of consolidated issues per goal are: favorability 2, usefulness 3, credibility 7, operability 6, understandability 5, readability 4, responsiveness 2." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
          <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1c1c1a" text-anchor="middle">
