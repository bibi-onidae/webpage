            <text x="320" y="44">Usefulness</text>
            <text x="387" y="44">Credibility</text>
            <text x="454" y="36">Oper-</text><text x="454" y="51">ability</text>
            <text x="521" y="36">Under-</text><text x="521" y="51">standability</text>
            <text x="588" y="36">Read-</text><text x="588" y="51">ability</text>
            <text x="655" y="36">Respon-</text><text x="655" y="51">siveness</text>
          </g>
