<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Framework loop: Prototyping with LLM leads to Requirements acquisition, a multi-agent process with two human review points, which leads to Prototype evaluation by the designer. The designer either revises, looping back to prototyping, or accepts and moves to implementation." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
          <defs>
            <marker id="vdA2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1a"/></marker>
            <marker id="vdA3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#86837b"/></marker>
          </defs>
          <g font-family="Inter, Arial, sans-serif">
            <!-- revise loop -->
            <path d="M630 60 V12 H110 V56" fill="none" stroke="#86837b" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#vdA3)"/>
            <text x="370" y="8" dy="-1" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#86837b" transform="translate(0,20)">revise</text>

            <!-- A -->
            <rect x="20" y="60" width="180" height="96" rx="12" fill="#e7eefb" stroke="#2f6fd6"/>
            <text x="110" y="94" text-anchor="middle" font-size="15" fill="#1c1c1a">Prototyping</text>
            <text x="110" y="113" text-anchor="middle" font-size="15" fill="#1c1c1a">with LLM</text>
            <text x="110" y="138" text-anchor="middle" font-size="12" fill="#86837b" font-family="IBM Plex Mono, monospace">Cursor ⇄ Figma (MCP)</text>

            <line x1="200" y1="108" x2="226" y2="108" stroke="#1c1c1a" stroke-width="1.2" marker-end="url(#vdA2)"/>

            <!-- B container -->
            <rect x="230" y="36" width="300" height="236" rx="14" fill="#f8f7f4" stroke="#2f6fd6"/>
            <text x="380" y="58" text-anchor="middle" font-size="14" fill="#2f6fd6">Requirements acquisition</text>

            <g font-size="14" text-anchor="middle" fill="#1c1c1a">
              <rect x="252" y="72"  width="256" height="32" rx="8" fill="#fff" stroke="#e4e1da"/>
              <text x="380" y="93">Generate virtual users</text>
              <rect x="252" y="126" width="256" height="32" rx="8" fill="#fff" stroke="#e4e1da"/>
              <text x="380" y="147">Generate task scenarios</text>
              <rect x="252" y="180" width="256" height="32" rx="8" fill="#fff" stroke="#e4e1da"/>
              <text x="380" y="201">Interviews on SGI matrix</text>
              <rect x="252" y="228" width="256" height="32" rx="8" fill="#fff" stroke="#e4e1da"/>
              <text x="380" y="249">Coordinate requirements</text>
            </g>
            <line x1="380" y1="104" x2="380" y2="124" stroke="#1c1c1a" marker-end="url(#vdA2)"/>
            <line x1="380" y1="158" x2="380" y2="178" stroke="#1c1c1a" marker-end="url(#vdA2)"/>
            <line x1="380" y1="212" x2="380" y2="226" stroke="#1c1c1a" marker-end="url(#vdA2)"/>
            <!-- HITL pills -->
            <g font-family="IBM Plex Mono, monospace" font-size="11">
              <rect x="400" y="107" width="100" height="16" rx="8" fill="#1c1c1a"/>
              <text x="450" y="119" text-anchor="middle" fill="#fff">designer check</text>
              <rect x="400" y="161" width="100" height="16" rx="8" fill="#1c1c1a"/>
              <text x="450" y="173" text-anchor="middle" fill="#fff">designer check</text>
            </g>

            <line x1="530" y1="108" x2="556" y2="108" stroke="#1c1c1a" stroke-width="1.2" marker-end="url(#vdA2)"/>

            <!-- C -->
            <rect x="560" y="60" width="140" height="96" rx="12" fill="#ecebe6"/>
            <text x="630" y="98"  text-anchor="middle" font-size="15" fill="#1c1c1a">Prototype</text>
            <text x="630" y="117" text-anchor="middle" font-size="15" fill="#1c1c1a">evaluation</text>
            <text x="630" y="140" text-anchor="middle" font-size="12" fill="#86837b" font-family="IBM Plex Mono, monospace">designer decides</text>

            <line x1="630" y1="156" x2="630" y2="200" stroke="#1c1c1a" stroke-width="1.2" marker-end="url(#vdA2)"/>
            <text x="640" y="183" font-size="12" fill="#86837b" font-family="IBM Plex Mono, monospace">accept</text>
            <rect x="570" y="204" width="120" height="40" rx="10" fill="#fff" stroke="#1c1c1a"/>
            <text x="630" y="229" text-anchor="middle" font-size="14" fill="#1c1c1a">Implementation</text>
          </g>
        </svg>