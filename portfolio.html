<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portfolio of Jisun Hwang — Research systems, interfaces, 3D characters, retail spaces, and artworks — the objects behind the papers.">
<title>Jisun Hwang | Portfolio</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

<!--
================================================================================
  JISUN HWANG — PORTFOLIO  /  편집 가이드
================================================================================

  ▷ 폴더 구조
      webpage/
        index.html
        portfolio.html              ← 이 파일
        assets/portfolio/           ← 포트폴리오 사진 폴더

  ▷ index.html 상단 메뉴에 아래 한 줄을 추가하면 연결됩니다.
      <a href="portfolio.html">Portfolio</a>

  ▷ 수정은 파일 아래 두 곳만 보면 됩니다.
      ★ TOPICS          — 위쪽 토픽 버튼의 순서
      ★ PORTFOLIO_DATA  — 프로젝트 내용

  ▷ 토픽 규칙 (중요)
      · 카드에 보이는 토픽 = 그 프로젝트의 topics: [ ... ] 그대로입니다.
      · 위쪽 필터 버튼 = 프로젝트들에 실제로 쓰인 토픽만 자동으로 만들어집니다.
        그래서 카드와 필터가 항상 똑같은 이름으로 맞춰집니다.
      · TOPICS 는 "버튼 순서"만 정합니다. 여기에 없는 새 토픽을 프로젝트에 적으면
        자동으로 맨 뒤에 추가되고, 어느 프로젝트에도 안 쓰인 토픽은 버튼이 생기지 않습니다.
      · 철자와 대소문자가 같아야 같은 토픽으로 인식됩니다 ('AI' ≠ 'Ai').

  ▷ 보기 방식 (Cards / List)
      · 필터 아래 오른쪽의 Cards / List 로 바꿉니다. 마지막으로 고른 방식은 브라우저에 기억됩니다.
      · List 는 사진 없이 한 줄씩 보여줍니다. 제목을 누르면 Cards 와 똑같은 큰 페이지(팝업)가 열립니다.
      · List 에서 쓰는 내용도 PORTFOLIO_DATA 그대로입니다 — 따로 적을 필요 없습니다.

  ▷ 사진
      · cover  : 카드 썸네일 1장. 칸에 꽉 차게 확대되어 모든 카드가 같은 크기로 보입니다.
                 평소엔 흑백, 마우스를 올리면 컬러.  '' 로 두면 제목만 있는 카드가 됩니다.
      · images : 팝업 안에서 위에서부터 보이는 사진들 (원본 비율 그대로, 잘리지 않음)
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  /* index.html 과 동일한 디자인 변수 */
  :root {
    --bg:        #FAF9F7;
    --ink:       #14130F;
    --ink-soft:  #3A372F;
    --ink-mute:  #5F5B52;
    --ink-faint: #8A8578;
    --line:      #EAE7E1;
    --line-soft: #EEEBE5;
    --accent:    #1D6FC0;
    --chip-line: #DEDAD2;
    --card:      rgba(250,249,247,.42);   /* 카드 판면 — 토픽 칩과 같은 반투명 판면 */
    --maxw:      1180px;
    --navh:      82px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--accent); }
  p { text-wrap: pretty; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* 상단바 — index.html 과 같음 */
  header.topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    background: rgba(250,249,247,.42); backdrop-filter: blur(9px);
    border-bottom: 1px solid var(--line);
  }
  header.topbar nav {
    max-width: var(--maxw); margin: 0 auto; padding: 13px 32px;
    display: flex; justify-content: flex-end; gap: 34px; flex-wrap: wrap;
    font-size: 15.5px; font-weight: 400;
  }
  header.topbar nav a { padding: 4px 13px; border-radius: 999px; transition: color .3s ease; }
  /* 왼쪽 상단 홈 마크 ✻ — 누르면 메인으로 */
  header.topbar nav a.brand { margin-right: auto; padding: 0 2px; font-size: 32px; font-weight: 700; line-height: 1; color: var(--ink); transition: transform .5s ease, color .3s ease; }
  header.topbar nav a.brand:hover { color: var(--accent); transform: rotate(90deg); }
  /* 다른 페이지로 가는 링크(About Me) — index.html 의 Portfolio 버튼과 같은 모양 */
  header.topbar nav a.nav-ext {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
    transition: color .3s ease, border-color .3s ease;
  }
  header.topbar nav a.nav-ext span { font-size: .85em; }
  header.topbar nav a.nav-ext:hover { color: var(--accent); border-color: var(--accent); }

  #glow { position: fixed; top: 0; left: 0; width: 400px; height: 400px; margin: -200px 0 0 -200px;
          border-radius: 50%; filter: blur(18px); pointer-events: none; z-index: 0; opacity: 0;
          transition: opacity .5s ease; }

  .wrap { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto;
          padding: calc(var(--navh) + 56px) 32px 160px; }

  /* ── 머리글 ────────────────────────────────────────────────────────── */
  .head {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 44%);
    gap: 40px; align-items: end; margin-bottom: 44px;
  }
  .head h1 {
    margin: 0; font-weight: 300; font-size: clamp(48px, 7vw, 92px); line-height: .96;
    letter-spacing: -.035em;
  }
  .head h1 em {
    font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
    letter-spacing: -.02em;
  }
  .head .sub { margin: 22px 0 0; max-width: 46ch; font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); }

  /* 토픽 필터 — 박스 없이 */
  .filter .ft { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .filter .ft h2 { margin: 0; font-weight: 400; font-size: 20px; letter-spacing: -.02em; }
  .filter .ft .count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; }
  .filter .ft .clear { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .04em; color: var(--ink-faint); }
  .filter .ft .clear:hover { color: var(--accent); }
  .filter .ft .clear[hidden] { display: none; }

  /* ── 토픽 칩 — index.html 의 키워드 칩과 같은 모양·애니메이션 ───────── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-block; will-change: transform;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .05em;
    padding: 5px 10px; border: 1px solid var(--chip-line); border-radius: 999px;
    background: rgba(250,249,247,.42); backdrop-filter: blur(9px);
    color: var(--ink);
    transition: border-color .2s, color .2s;
  }
  .filter .chip { animation: kwFloat 5.4s ease-in-out infinite; }
  @keyframes kwFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    33%     { transform: translateY(-4px) rotate(-.6deg); }
    66%     { transform: translateY(3px) rotate(.5deg); }
  }
  .filter .chip:hover { border-color: var(--ink-mute); }
  .chip[aria-pressed="true"], .chip.on { border-color: var(--accent); color: var(--accent); }
  /* 카드·팝업 안의 칩: 같은 모양, 조금 작게, 떠다니지 않음 */
  .chips.sm { gap: 4px; }
  .chips.sm .chip { font-size: 10.5px; padding: 3px 8px; }

  /* ── 카드 그리드 ───────────────────────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
  .card {
    display: flex; flex-direction: column; text-align: left;
    background: var(--card); backdrop-filter: blur(9px); border: 1px solid var(--chip-line); border-radius: 12px;
    padding: 14px 16px 18px; aspect-ratio: 3 / 4; min-height: 0; overflow: hidden;
    transition: opacity .32s ease, transform .32s ease, background .3s ease, border-color .2s;
  }
  .card:hover { background: rgba(255,255,255,.55); border-color: var(--ink-mute); }
  .card.out { opacity: 0; transform: scale(.985); pointer-events: none; }   /* 필터 제외 — 자리는 남김 */
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .card .date { flex: 0 0 auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); padding-top: 3px; }

  /* 사진 카드: 액자형 — 카드 가운데에 같은 크기의 세로 액자, 아래에 제목.
     사진 비율과 상관없이 액자 안을 꽉 채워서 모든 카드가 똑같이 보입니다.
     평소 흑백, 호버 시 컬러 */
  .card.has-img .fig {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 6px 0 8px;
  }
  .card.has-img .frame {
    width: 100%; max-height: 100%; aspect-ratio: 4 / 5; max-width: 86%;
    overflow: hidden; background: #E6E3DC;
  }
  .card.has-img .frame :is(img, video) {
    width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;
    filter: grayscale(1) contrast(1.02);
    transition: filter .45s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card.has-img:hover .frame :is(img, video), .card.has-img:focus-visible .frame :is(img, video) { filter: none; transform: scale(1.04); }
  .card.has-img .title {
    width: 86%; margin: 12px auto 0; text-align: left;
    font-size: 15px; line-height: 1.4; font-weight: 400; letter-spacing: -.01em;
  }

  /* 사진 없는 카드: 제목만 왼쪽 정렬 */
  .card.no-img .fig { flex: 1 1 auto; display: flex; align-items: center; }
  .card.no-img .title { margin: 0; font-size: 18px; line-height: 1.36; font-weight: 400; letter-spacing: -.014em; }
  .card.no-img .title::after { content: ' ↗'; color: var(--ink-faint); }
  .card .foot { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-faint); letter-spacing: .03em; margin-top: 12px; }

  /* ── 보기 전환 (Cards / List) ────────────────────────────────────── */
  .viewbar { display: flex; justify-content: flex-end; align-items: baseline; gap: 8px; margin: 0 0 14px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-faint); }
  .viewbar button { padding: 2px 0; color: var(--ink-faint); border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
  .viewbar button:hover { color: var(--accent); }
  .viewbar button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .view-in { animation: expand .3s cubic-bezier(.2,.8,.2,1) both; }
  [hidden] { display: none !important; }

  /* ── 리스트 — index.html 의 Projects 목록과 같은 모양·애니메이션, 사진 없음 ── */
  @keyframes expand { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .list { border-bottom: 1px solid var(--line-soft); }
  .lrow { border-top: 1px solid var(--line-soft); transition: padding-left .25s ease, background .25s ease; }
  .lrow:hover { padding-left: 10px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.26) 12%,
                rgba(255,255,255,.42) 28%, rgba(255,255,255,.2) 62%, rgba(255,255,255,0) 92%); }
  .lrow.in { animation: expand .28s cubic-bezier(.2,.8,.2,1) both; }      /* 필터로 다시 나타날 때 */
  .lrow .lhead { width: 100%; text-align: left; display: grid; gap: 14px; align-items: start; padding: 11px 0;
                 grid-template-columns: minmax(0,128px) minmax(0,1fr) auto auto; }
  .lrow .when  { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-faint); padding-top: 3px; }
  .lrow .ltitle { margin: 0 0 3px; font-size: 16px; line-height: 1.35; font-weight: 600; letter-spacing: -.012em; }
  .lrow .lmeta  { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-mute); }
  .lrow .chips  { justify-content: flex-end; padding-top: 1px; max-width: 220px; }
  .lrow .sign   { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--accent); line-height: 1.3; padding-top: 1px; width: 12px; text-align: center; transition: transform .25s ease; }
  .lrow .lhead:hover .sign, .lrow .lhead:focus-visible .sign { transform: translate(2px,-2px); }
  .lrow .lbody  { padding: 0 0 18px calc(128px + 14px); animation: expand .28s cubic-bezier(.2,.8,.2,1) both; }
  .lrow .lbody .p-lead { margin: 0 0 10px; font-size: 15.5px; line-height: 1.5; color: var(--ink); max-width: 66ch; }
  .lrow .lbody .p-body { margin: 0 0 8px; font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); max-width: 70ch; }
  .lrow .lbody .p-head { margin: 14px 0 6px; font-size: 14.5px; font-weight: 600; }
  .lrow .lbody .p-out  { margin: 10px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--accent); max-width: 70ch; }
  .lrow .lbody .p-more { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px;
                         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .03em; }
  .lrow .lbody .p-more a, .lrow .lbody .p-more button { color: var(--accent); }
  .lrow .lbody .p-more a:hover, .lrow .lbody .p-more button:hover { text-decoration: underline; }

  .empty { padding: 60px 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-faint); }

  footer.foot { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 64px; }
  footer.foot p { margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-faint); }

  /* ── 전체 화면 팝업 ────────────────────────────────────────────────── */
  .modal { position: fixed; inset: 0; z-index: 60; display: none; }
  .modal.open { display: block; }
  .modal .scrim { position: absolute; inset: 0; background: var(--bg); }
  .modal .panel {
    position: relative; height: 100%; overflow-y: auto;
    max-width: var(--maxw); margin: 0 auto; padding: 0 32px 120px;
    animation: rise .34s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .modal .bar {
    position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
    padding: 38px 0 14px; background: linear-gradient(rgba(250,249,247,1) 70%, rgba(250,249,247,0));
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-faint);
  }
  .modal .bar .nav { display: flex; gap: 18px; }
  .modal .bar button:hover { color: var(--accent); }
  .modal .body { display: grid; grid-template-columns: minmax(240px, 30%) minmax(0, 1fr); gap: 48px; padding-top: 28px; }
  .modal .meta { position: sticky; top: 84px; align-self: start; }
  .modal .meta h2 { margin: 0 0 18px; font-weight: 400; font-size: clamp(26px, 3vw, 36px); line-height: 1.12; letter-spacing: -.028em; }
  .modal .meta dl { margin: 0; display: grid; grid-template-columns: 74px minmax(0,1fr); row-gap: 10px; column-gap: 12px;
                    font-size: 13.5px; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 16px; }
  .modal .meta dt { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); padding-top: 3px; }
  .modal .meta dd { margin: 0; color: var(--ink-soft); }
  .modal .meta .chips { margin-top: 18px; }
  .modal .meta .links { margin-top: 20px; display: flex; flex-direction: column; gap: 6px; }
  .modal .meta .links a { color: var(--accent); font-size: 13.5px; }
  .modal .meta .links a:hover { text-decoration: underline; }
  .modal .content { min-width: 0; }
  .modal .content .lead { margin: 0 0 26px; font-size: 19px; line-height: 1.5; letter-spacing: -.012em; max-width: 58ch; }
  .modal .content .para { margin: 0 0 16px; font-size: 15.5px; line-height: 1.62; color: var(--ink-soft); max-width: 66ch; }
  .modal .content .outcome { margin: 22px 0 32px; padding-left: 14px; border-left: 2px solid var(--accent);
                             font-size: 15px; line-height: 1.55; max-width: 60ch; }
  .modal .content h3 { margin: 30px 0 10px; font-weight: 500; font-size: 17px; letter-spacing: -.012em; }
  .modal .content .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 14px; margin: 0 0 22px; }
  .modal .content .row figure { margin: 0; }
  .modal .content figure { margin: 0 0 22px; }
  .modal .content figure :is(img, video) { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .modal .content figure.pad :is(img, video) { padding: 18px; }
  .modal .content figure .embed { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }   /* 다이어그램처럼 배경 흰 그림은 안쪽 여백 */
  .modal .content figcaption { margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); letter-spacing: .03em; }
  body.lock { overflow: hidden; }

  /* 스크롤바 숨김 — 스크롤은 그대로 됩니다 */
  html, .modal .panel { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, .modal .panel::-webkit-scrollbar { display: none; }

  /* ── 좁은 화면 ─────────────────────────────────────────────────────── */
  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .head { grid-template-columns: 1fr; gap: 26px; }
    .modal .body { grid-template-columns: 1fr; gap: 28px; }
    .modal .meta { position: static; }
    .lrow .lhead { grid-template-columns: minmax(0,1fr) auto; row-gap: 4px; }
    .lrow .when  { grid-column: 1 / -1; padding-top: 0; }
    .lrow .chips { grid-column: 1; grid-row: 3; justify-content: flex-start; max-width: none; }
    .lrow .sign  { grid-column: 2; grid-row: 2; }
    .lrow .lbody { padding-left: 0; }
    .lrow .ltitle { font-size: 15.5px; }
  }
  @media (max-width: 860px) {
    header.topbar nav { justify-content: center; gap: 18px; padding: 11px 18px; font-size: 14px; }
    header.topbar nav a { padding: 4px 6px; }
    header.topbar nav { justify-content: space-between; }
    header.topbar nav a.brand { margin-right: 0; }
    .wrap { padding: calc(var(--navh) + 20px) 20px 100px; }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { aspect-ratio: 4 / 5; }
    .head h1 { font-size: 44px; }
    .modal .panel { padding: 0 18px 80px; }
    .modal .bar { padding-top: 20px; }
  }
  /* 터치 기기에는 호버가 없으니 사진을 컬러로 */
  @media (hover: none) {
    .card.has-img .frame :is(img, video) { filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #glow { display: none; }
    .filter .chip { animation: none; }
    .card, .modal .panel, .card.has-img .frame :is(img, video) { transition: none; animation: none; }
    .lrow, .lrow.in, .lrow .lbody, .view-in { transition: none; animation: none; }
  }
</style>
</head>

<body>

<div id="glow"></div>

<script>

              예) title: 'Vibe Design:\na human-in-the-loop UI design agent'
              \n 이 없으면 칸 폭에 맞춰 자연스럽게 줄바꿈되고,

       { images: ['경로1', '경로2'], caption: '설명' }      ← 사진 2~3장을 한 줄에 나란히

/* ==============================================================================
   아래는 화면을 그리는 코드입니다. 내용 수정만 할 경우 건드리지 않아도 됩니다.
   ============================================================================ */
(function () {
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const $ = id => document.getElementById(id);
  const brk  = s => esc(s).replace(/\s*\n\s*/g, '<br>');          /* 카드 제목: \n → 줄바꿈 */
  const flat = s => String(s == null ? '' : s).replace(/\s*\n\s*/g, ' ');  /* 그 밖: \n → 띄어쓰기 */

  /* 영상 — 경로가 .mp4/.webm/.mov/.m4v 로 끝나면 사진 대신 영상으로 */
  const isVideo = s => /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(String(s || ''));
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const media = (src, alt) => isVideo(src)
    ? `<video src="${esc(src)}" ${calm ? 'controls' : 'autoplay loop'} muted playsinline preload="metadata" aria-label="${esc(alt)}"></video>`
    : `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`;
  /* 유튜브·비메오 주소 → 플레이어 주소 */
  const embedOf = u => {
    let m = String(u || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (m) return 'https://www.youtube-nocookie.com/embed/' + m[1];
    m = String(u || '').match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return 'https://player.vimeo.com/video/' + m[1];
    return '';
  };
  const topicsOf = p => (p.topics || []).map(t => String(t).trim()).filter(Boolean);
  let current = null;
  let openIdx = -1;

  /* 필터 버튼 = 실제로 쓰인 토픽만, TOPICS 순서 우선 → 카드와 항상 일치 */
  const used = [];
  PORTFOLIO_DATA.forEach(p => topicsOf(p).forEach(t => { if (!used.includes(t)) used.push(t); }));
  const topicList = TOPICS.filter(t => used.includes(t)).concat(used.filter(t => !TOPICS.includes(t)));

  const chip = (t, on) => `<span class="chip${on ? ' on' : ''}" data-t="${esc(t)}">${esc(t)}</span>`;

  $('tags').innerHTML = topicList.map(t =>
    `<button type="button" class="chip" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join('');
  /* 떠다니는 타이밍을 서로 다르게 — index.html 과 같은 방식 */
  document.querySelectorAll('#tags .chip').forEach((c, i) => {
    c.style.animationDelay = (i * 0.47).toFixed(2) + 's';
    c.style.animationDuration = (4.6 + (i % 4) * 0.7).toFixed(1) + 's';
  });

  /* 카드 */
  $('grid').innerHTML = PORTFOLIO_DATA.map((p, i) => {
    const has = !!p.cover;
    return `
      <button type="button" class="card ${has ? 'has-img' : 'no-img'}" data-i="${i}" aria-label="Open: ${esc(flat(p.title))}">
        <div class="top">
          <div class="chips sm">${topicsOf(p).map(t => chip(t)).join('')}</div>
          <span class="date">${esc(p.date)}</span>
        </div>
        <div class="fig">${has ? `<div class="frame">${media(p.cover, '')}</div>` : `<p class="title">${brk(p.title)}</p>`}</div>
        ${has ? `<p class="title">${brk(p.title)}</p>` : (p.footnote ? `<div class="foot">${esc(p.footnote)}</div>` : '')}
      </button>`;
  }).join('');
  const cards = Array.from(document.querySelectorAll('.card'));

  /* 리스트 — 사진 없이 글만. 제목을 누르면 그 자리에서 펼쳐짐 */
  const hasImages = p => !!p.cover || (p.content || []).some(b => b.image || b.images || b.video);
  const textBlocks = p => (p.content || []).map(b => {
    if (b.lead)    return `<p class="p-lead">${esc(b.lead)}</p>`;
    if (b.text)    return `<p class="p-body">${esc(b.text)}</p>`;
    if (b.heading) return `<p class="p-head">${esc(b.heading)}</p>`;
    if (b.outcome) return `<p class="p-out">${esc(b.outcome)}</p>`;
    return '';
  }).join('');
  $('list').innerHTML = PORTFOLIO_DATA.map((p, i) => {
    const meta = [p.role, p.org].filter(Boolean).map(esc).join(' · ');
    return `
      <div class="lrow" data-i="${i}">
        <button type="button" class="lhead" data-open="${i}" aria-haspopup="dialog" aria-label="Open: ${esc(flat(p.title))}">
          <span class="when">${esc(p.date)}</span>
          <span>
            <p class="ltitle">${esc(flat(p.title))}</p>
            ${meta ? `<p class="lmeta">${meta}</p>` : ''}
          </span>
          <span class="chips sm">${topicsOf(p).map(t => chip(t)).join('')}</span>
          <span class="sign" aria-hidden="true">↗</span>
        </button>
      </div>`;
  }).join('');
  const rows = Array.from(document.querySelectorAll('.lrow'));
  /* List 에서도 제목을 누르면 Cards 와 같은 팝업이 열림 */
  $('list').addEventListener('click', e => {
    const o = e.target.closest('[data-open]');
    if (o) open(+o.dataset.open, o);
  });

  /* 필터 — 제외된 카드는 자리만 남기고 사라지고, 선택한 토픽은 카드 안에서도 파랗게 */
  function applyFilter() {
    let shown = 0;
    cards.forEach(c => {
      const on = !current || topicsOf(PORTFOLIO_DATA[+c.dataset.i]).includes(current);
      c.classList.toggle('out', !on);
      c.setAttribute('aria-hidden', on ? 'false' : 'true');
      c.tabIndex = on ? 0 : -1;
      if (on) shown++;
    });
    rows.forEach(r => {
      const on = !current || topicsOf(PORTFOLIO_DATA[+r.dataset.i]).includes(current);
      if (on && r.hidden) { r.classList.remove('in'); void r.offsetWidth; r.classList.add('in'); }
      r.hidden = !on;
    });
    document.querySelectorAll('#tags .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.topic === current ? 'true' : 'false'));
    document.querySelectorAll('.card .chip, .lrow .chip, #m-tags .chip').forEach(s => s.classList.toggle('on', s.dataset.t === current));
    $('clear').hidden = !current;
    $('count').textContent = shown + ' / ' + PORTFOLIO_DATA.length;
    $('empty').hidden = shown > 0;
  }
  $('tags').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    current = (current === b.dataset.topic) ? null : b.dataset.topic;
    applyFilter();
  });
  $('clear').addEventListener('click', () => { current = null; applyFilter(); });
  applyFilter();

  /* 팝업 */
  const modal = $('modal');
  function render(i) {
    const p = PORTFOLIO_DATA[i];
    $('m-index').textContent = String(i + 1).padStart(2, '0') + ' / ' + String(PORTFOLIO_DATA.length).padStart(2, '0');
    $('m-title').textContent = flat(p.title);
    const rows = [['Role', p.role], ['Where', p.org], ['When', p.year]].filter(r => r[1]);
    $('m-dl').innerHTML = rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('');
    $('m-tags').innerHTML = topicsOf(p).map(t => chip(t, t === current)).join('');
    $('m-links').innerHTML = (p.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
    const fig = (src, cap, pad) => `<figure${pad ? ' class="pad"' : ''}>${media(src, cap || flat(p.title))}</figure>`;
    const blocks = (p.content || []).map(b => {
      if (b.lead)    return `<p class="lead">${esc(b.lead)}</p>`;
      if (b.text)    return `<p class="para">${esc(b.text)}</p>`;
      if (b.heading) return `<h3>${esc(b.heading)}</h3>`;
      if (b.outcome) return `<p class="outcome">${esc(b.outcome)}</p>`;
      if (b.image)   return fig(b.image, b.caption, b.pad).replace('</figure>', b.caption ? `<figcaption>${esc(b.caption)}</figcaption></figure>` : '</figure>');
      if (b.images)  return `<div class="row">${b.images.map(src => fig(src, b.caption, b.pad)).join('')}</div>` + (b.caption ? `<figcaption style="margin:-14px 0 22px">${esc(b.caption)}</figcaption>` : '');
      if (b.video) {
        const cap = b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : '';
        const em = embedOf(b.video);
        return em
          ? `<figure><iframe class="embed" src="${esc(em)}" title="${esc(b.caption || flat(p.title))}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>${cap}</figure>`
          : `<figure><video src="${esc(b.video)}" controls playsinline preload="metadata"></video>${cap}</figure>`;
      }
      return '';
    }).join('');
    $('m-content').innerHTML = blocks || `<p class="para">Details coming soon.</p>`;
    modal.querySelector('.panel').scrollTop = 0;
  }
  let opener = null;
  function open(i, from) {
    opener = from || cards[i];
    openIdx = i; render(i);
    modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    modal.querySelector('.close').focus();
  }
  function close() {
    $('m-content').querySelectorAll('video').forEach(v => v.pause());          /* 닫으면 소리 멈춤 */
    $('m-content').querySelectorAll('iframe').forEach(f => { f.src = f.src; });
    modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lock');
    if (opener && opener.isConnected) opener.focus();
    opener = null;
    openIdx = -1;
  }
  function step(d) {
    const vis = cards.filter(c => !c.classList.contains('out')).map(c => +c.dataset.i);
    if (!vis.length) return;
    let k = vis.indexOf(openIdx); k = (k + d + vis.length) % vis.length;
    openIdx = vis[k]; render(openIdx);
  }
  $('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c && !c.classList.contains('out')) open(+c.dataset.i, c); });

  /* 보기 전환 — 마지막 선택을 기억 */
  function setView(v, animate) {
    const list = v === 'list';
    $('grid').hidden = list; $('list').hidden = !list;
    document.querySelectorAll('.viewbar [data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'));
    if (animate) { const el = list ? $('list') : $('grid'); el.classList.remove('view-in'); void el.offsetWidth; el.classList.add('view-in'); }
    try { localStorage.setItem('portfolio-view', v); } catch (e) {}
  }
  document.querySelector('.viewbar').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view, true);
  });
  let saved = null; try { saved = localStorage.getItem('portfolio-view'); } catch (e) {}
  setView(saved === 'list' ? 'list' : 'cards', false);
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
  $('m-prev').addEventListener('click', () => step(-1));
  $('m-next').addEventListener('click', () => step(1));
  addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  /* 마우스를 따라다니는 빛 — index.html 과 같음 */
  const glow = $('glow');
  if (glow && matchMedia('(pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const mix = (a, b, u) => a.map((v, i) => Math.round(v + (b[i] - v) * u));
    const G1 = [56,178,232], G2 = [72,214,196], G3 = [148,240,92];
    let tx = 0, ty = 0, cx = 0, cy = 0, started = false;
    addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY;
      if (!started) { started = true; cx = tx; cy = ty; glow.style.opacity = '1'; } }, { passive: true });
    (function tick() {
      cx += (tx - cx) * .08; cy += (ty - cy) * .08;
      glow.style.transform = `translate(${cx}px,${cy}px)`;
      const doc = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const u = Math.min(1, Math.max(0, (scrollY + cy) / (doc + innerHeight)));
      const c = u < .5 ? mix(G1, G2, u / .5) : mix(G2, G3, (u - .5) / .5);
      glow.style.background = `radial-gradient(circle, rgba(${c},.30) 0%, rgba(${c},.11) 45%, rgba(${c},0) 70%)`;
      requestAnimationFrame(tick);
    })();
  }
})();
</script>

</body>
</html>
